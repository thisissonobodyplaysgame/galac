<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Games</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/style.css">

    <style>
        :root {
            --deep-space: #05040f;
            --nebula-purple: #a855f7;
            --cosmic-pink: #ec4899;
            --cosmic-cyan: #22d3ee;
            --star-white: #ffffff;
            --glass-bg: rgba(168, 85, 247, 0.07);
            --glass-border: rgba(168, 85, 247, 0.3);
            --text-muted: #cdbde9;
            --main-font: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', 'Comic Neue', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body { height: 100%; }

        body {
            font-family: var(--main-font);
            background: radial-gradient(ellipse at 20% 10%, #1a0b3d 0%, #05040f 55%, #05040f 100%),
                        radial-gradient(ellipse at 80% 90%, #2a0a3a 0%, transparent 60%);
            background-color: var(--deep-space);
            color: var(--star-white);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            letter-spacing: 0.3px;
        }

        /* ===== Background Themes (galaxy styles) ===== */
        body.theme-deep {
            background: radial-gradient(ellipse at 20% 10%, #1a0b3d 0%, #05040f 55%, #05040f 100%),
                        radial-gradient(ellipse at 80% 90%, #2a0a3a 0%, transparent 60%);
            background-color: var(--deep-space);
        }
        body.theme-deep .nebula-1 { background: #7c3aed; }
        body.theme-deep .nebula-2 { background: #db2777; }
        body.theme-deep .nebula-3 { background: #0ea5e9; }

        body.theme-aurora {
            background: radial-gradient(ellipse at 15% 20%, #022c22 0%, #02131a 60%, #02131a 100%),
                        radial-gradient(ellipse at 85% 85%, #064e3b 0%, transparent 55%);
            background-color: #02131a;
        }
        body.theme-aurora .nebula-1 { background: #34d399; }
        body.theme-aurora .nebula-2 { background: #2dd4bf; }
        body.theme-aurora .nebula-3 { background: #38bdf8; }
        body.theme-aurora .stars, body.theme-aurora .stars2, body.theme-aurora .stars3 { opacity: 0.35; }

        body.theme-flare {
            background: radial-gradient(ellipse at 25% 15%, #3d0a1a 0%, #17030a 55%, #17030a 100%),
                        radial-gradient(ellipse at 75% 85%, #4c0519 0%, transparent 60%);
            background-color: #17030a;
        }
        body.theme-flare .nebula-1 { background: #f97316; }
        body.theme-flare .nebula-2 { background: #ef4444; }
        body.theme-flare .nebula-3 { background: #f43f5e; }
        body.theme-flare .stars, body.theme-flare .stars2, body.theme-flare .stars3 { opacity: 0.3; }

        body.theme-candy {
            background: radial-gradient(ellipse at 20% 15%, #3b1866 0%, #1a0b33 55%, #1a0b33 100%),
                        radial-gradient(ellipse at 80% 85%, #4c1d95 0%, transparent 60%);
            background-color: #1a0b33;
        }
        body.theme-candy .nebula-1 { background: #e879f9; }
        body.theme-candy .nebula-2 { background: #a78bfa; }
        body.theme-candy .nebula-3 { background: #f0abfc; }
        body.theme-candy .stars, body.theme-candy .stars2, body.theme-candy .stars3 { opacity: 0.45; }

        body.theme-vortex {
            background: radial-gradient(ellipse at 50% 40%, #1e1b4b 0%, #0f0c29 60%, #0f0c29 100%),
                        radial-gradient(ellipse at 15% 90%, #312e81 0%, transparent 60%),
                        radial-gradient(ellipse at 90% 10%, #4338ca 0%, transparent 55%);
            background-color: #0f0c29;
        }
        body.theme-vortex .nebula-1 { background: #6366f1; }
        body.theme-vortex .nebula-2 { background: #8b5cf6; }
        body.theme-vortex .nebula-3 { background: #06b6d4; }
        body.theme-vortex .stars, body.theme-vortex .stars2, body.theme-vortex .stars3 { opacity: 0.5; }

        body.theme-emerald {
            background: radial-gradient(ellipse at 30% 20%, #022c22 0%, #04110c 55%, #04110c 100%),
                        radial-gradient(ellipse at 70% 80%, #065f46 0%, transparent 60%);
            background-color: #04110c;
        }
        body.theme-emerald .nebula-1 { background: #10b981; }
        body.theme-emerald .nebula-2 { background: #059669; }
        body.theme-emerald .nebula-3 { background: #14b8a6; }
        body.theme-emerald .stars, body.theme-emerald .stars2, body.theme-emerald .stars3 { opacity: 0.3; }

        /* ===== Animated Starfield ===== */
        .stars, .stars2, .stars3 {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .stars { background-image:
            radial-gradient(2px 2px at 20px 30px, #ffffff, transparent),
            radial-gradient(2px 2px at 40px 70px, #c3a4ff, transparent),
            radial-gradient(1px 1px at 90px 40px, #ffffff, transparent),
            radial-gradient(2px 2px at 160px 120px, #8ed6ff, transparent),
            radial-gradient(1px 1px at 220px 80px, #ffffff, transparent),
            radial-gradient(2px 2px at 280px 160px, #ffb3f0, transparent);
            background-size: 280px 220px;
            animation: drift 120s linear infinite;
            opacity: 0.8;
        }
        .stars2 { background-image:
            radial-gradient(1px 1px at 30px 90px, #ffffff, transparent),
            radial-gradient(2px 2px at 110px 50px, #9de6ff, transparent),
            radial-gradient(1px 1px at 170px 140px, #ffffff, transparent),
            radial-gradient(2px 2px at 240px 30px, #d7b3ff, transparent);
            background-size: 240px 190px;
            animation: drift2 90s linear infinite;
            opacity: 0.6;
        }
        .stars3 { background-image:
            radial-gradient(1px 1px at 60px 60px, #ffffff, transparent),
            radial-gradient(1px 1px at 150px 110px, #ffffff, transparent);
            background-size: 180px 180px;
            animation: drift 150s linear infinite;
            opacity: 0.4;
        }
        @keyframes drift { from { background-position: 0 0; } to { background-position: 280px 220px; } }
        @keyframes drift2 { from { background-position: 0 0; } to { background-position: -240px -190px; } }

        /* ===== Nebula glow orbs ===== */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.22;
            z-index: 0;
            pointer-events: none;
        }
        .nebula-1 { width: 400px; height: 400px; top: -80px; left: -60px; background: #7c3aed; animation: float1 14s ease-in-out infinite; }
        .nebula-2 { width: 350px; height: 350px; bottom: -60px; right: -40px; background: #db2777; animation: float2 18s ease-in-out infinite; }
        .nebula-3 { width: 300px; height: 300px; top: 40%; left: 60%; background: #0ea5e9; animation: float1 20s ease-in-out infinite reverse; }
        @keyframes float1 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.08); } }
        @keyframes float2 { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-25px,20px) scale(1.05); } }

        /* ===== Header ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 4, 15, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--glass-border);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-icon {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--nebula-purple), var(--cosmic-pink));
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.6);
            font-size: 20px; color: #fff; flex-shrink: 0;
        }
        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #c084fc, #f0abfc, #67e8f9);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 6s linear infinite;
            white-space: nowrap;
        }
        @keyframes shine { to { background-position: 200% center; } }

        nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        nav a {
            display: flex; align-items: center; gap: 8px;
            padding: 11px 18px;
            border-radius: 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        nav a i { font-size: 1.05rem; }
        nav a:hover {
            color: #fff;
            background: rgba(168, 85, 247, 0.14);
            transform: translateY(-2px);
        }
        nav a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(168,85,247,0.38), rgba(236,72,153,0.28));
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
        }

        /* ===== Main ===== */
        main {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 60px;
            min-height: calc(100vh - 80px);
        }

        /* Content wrapper */
        #content-container {
            margin-bottom: 40px;
        }

        /* ===== Homepage ===== */
        .hero {
            text-align: center;
            padding: 60px 24px;
            margin-bottom: 50px;
            animation: fadeSlideUp 0.6s ease both;
        }
        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff, #c084fc, #f0abfc, #67e8f9, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 6s linear infinite;
            margin-bottom: 18px;
        }
        .hero .tagline {
            font-size: clamp(1.15rem, 2.5vw, 1.5rem);
            color: var(--text-muted);
            max-width: 640px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .hero .buttons {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 26px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        .btn i { font-size: 1.1rem; }
        .btn-primary {
            background: linear-gradient(135deg, var(--nebula-purple), var(--cosmic-pink));
            color: #fff;
            box-shadow: 0 6px 24px rgba(168, 85, 247, 0.5);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(168, 85, 247, 0.65); filter: brightness(1.1); }
        .btn-ghost { background: var(--glass-bg); color: #fff; backdrop-filter: blur(8px); }
        .btn-ghost:hover { transform: translateY(-3px); background: rgba(168, 85, 247, 0.18); }

        .section-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(168,85,247,0.08);
            padding: 44px 40px;
            margin-bottom: 30px;
            animation: fadeSlideUp 0.6s ease both;
        }
        .section-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }
        .section-card h2 i { color: var(--cosmic-cyan); }
        .section-card p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
        }
        .suggest-actions {
            margin-top: 24px;
            display: flex;
            justify-content: center;
        }

        /* ===== Background theme picker ===== */
        .bg-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin-top: 4px;
        }
        .bg-option {
            position: relative;
            border-radius: 14px;
            border: 2px solid var(--glass-border);
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
            background: var(--glass-bg);
        }
        .bg-option:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(168,85,247,0.35); }
        .bg-option.active { border-color: var(--cosmic-cyan); box-shadow: 0 0 0 3px rgba(34,211,238,0.25); }
        .bg-swatch {
            width: 100%;
            height: 70px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .bg-option .bg-name { font-size: 0.95rem; color: #fff; }
        .bg-swatch.sw-deep { background: radial-gradient(ellipse at 30% 20%, #1a0b3d, #05040f); }
        .bg-swatch.sw-aurora { background: radial-gradient(ellipse at 30% 20%, #022c22, #02131a); }
        .bg-swatch.sw-flare { background: radial-gradient(ellipse at 30% 20%, #3d0a1a, #17030a); }
        .bg-swatch.sw-candy { background: radial-gradient(ellipse at 30% 20%, #3b1866, #1a0b33); }
        .bg-swatch.sw-vortex { background: radial-gradient(ellipse at 30% 20%, #1e1b4b, #0f0c29); }
        .bg-swatch.sw-emerald { background: radial-gradient(ellipse at 30% 20%, #022c22, #04110c); }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 6px;
        }
        .link-card {
            display: flex; align-items: center; gap: 16px;
            padding: 22px 22px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            background: rgba(168, 85, 247, 0.08);
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
        }
        .link-card .icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--nebula-purple), var(--cosmic-pink));
        }
        .link-card .info h3 { font-size: 1.15rem; margin-bottom: 4px; }
        .link-card .info p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }
        .link-card:hover { transform: translateY(-4px); background: rgba(168,85,247,0.15); box-shadow: 0 10px 30px rgba(168,85,247,0.35); }
        .link-card:hover .icon { box-shadow: 0 0 20px rgba(168,85,247,0.6); }

        /* ===== Game Iframe ===== */
        #Game {
            display: none;
            width: 100%;
            height: 78vh;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            background: #000;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 0 60px rgba(168,85,247,0.15);
            animation: fadeIn 0.4s ease both;
            margin-bottom: 40px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== Game toolbar ===== */
        #gameBar {
            display: none;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* ===== Spinner ===== */
        #spinner {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            align-items: center;
            justify-content: center;
            background: rgba(5, 4, 15, 0.78);
            backdrop-filter: blur(6px);
        }
        .spinner-icon {
            width: 60px; height: 60px; border-radius: 50%;
            border: 4px solid rgba(168,85,247,0.2);
            border-top-color: var(--cosmic-cyan);
            border-right-color: var(--cosmic-pink);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Gallery ===== */
        .gallery-head {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeSlideUp 0.5s ease both;
        }
        .gallery-head h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #c084fc, #f0abfc, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
        .gallery-head p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .gallery-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }
        .gallery-tools input[type="text"] {
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(168,85,247,0.1);
            color: #fff;
            font-family: var(--main-font);
            font-size: 1rem;
            width: 260px;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .gallery-tools input[type="text"]:focus {
            border-color: var(--cosmic-cyan);
            box-shadow: 0 0 0 3px rgba(34,211,238,0.15);
        }
        .gallery-tools input[type="text"]::placeholder { color: #9b8cc0; }
        .gallery-tools select {
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(168,85,247,0.1);
            color: #fff;
            font-family: var(--main-font);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        .gallery-tools select option { background: #1a0b3d; color: #fff; }

        .count-badge {
            font-size: 0.95rem;
            color: var(--text-muted);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 20px;
        }

        /* ===== Category chips ===== */
        .cat-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 26px;
        }
        .chip {
            padding: 9px 16px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-muted);
            font-family: var(--main-font);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
        }
        .chip:hover {
            color: #fff;
            background: rgba(168,85,247,0.18);
            transform: translateY(-2px);
        }
        .chip.active {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, var(--nebula-purple), var(--cosmic-pink));
            box-shadow: 0 4px 18px rgba(168,85,247,0.5);
        }

        /* ===== Pagination ===== */
        .pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .page-btn {
            min-width: 42px;
            height: 42px;
            padding: 0 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-muted);
            font-family: var(--main-font);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .page-btn:hover {
            color: #fff;
            background: rgba(168,85,247,0.18);
            transform: translateY(-2px);
        }
        .page-btn.active {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, var(--nebula-purple), var(--cosmic-pink));
            box-shadow: 0 4px 18px rgba(168,85,247,0.5);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .page-ellipsis { opacity: 0.6; cursor: default; pointer-events: none; }
        .pagination .page-size {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 0.95rem;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 6px 12px; border-radius: 12px;
        }
        .pagination .page-size select {
            padding: 5px 8px; border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(168,85,247,0.14); color: #fff;
            font-family: var(--main-font); font-size: 0.95rem; cursor: pointer;
        }
        .pagination .page-size select option { background: #1a0b3d; color: #fff; }
        .pagination .page-nav { display: inline-flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .pagination .page-jump {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 0.95rem;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 5px 12px; border-radius: 12px;
        }
        .pagination .page-jump i { color: var(--cosmic-cyan); }
        .pagination .page-jump input[type="number"] {
            width: 64px; padding: 5px 8px; border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(168,85,247,0.14); color: #fff;
            font-family: var(--main-font); font-size: 0.95rem; text-align: center;
            -moz-appearance: textfield; appearance: textfield;
        }
        .pagination .page-jump input[type="number"]::-webkit-outer-spin-button,
        .pagination .page-jump input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .pagination .jump-total { color: var(--text-muted); min-width: 34px; }
        .page-go { min-width: 40px; height: 32px; padding: 0 10px; font-size: 0.9rem; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 22px;
        }
        .game-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: rgba(168,85,247,0.08);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(.2,.8,.2,1);
            animation: fadeSlideUp 0.4s ease both;
        }
        .game-card .thumb {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
            background: linear-gradient(135deg, #1a0b3d, #2a0a3a);
        }
        .game-card .thumb-ph {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #241552, #3b1260, #132c4d);
            overflow: hidden;
        }
        .game-card .thumb-ph .initials {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 0 18px rgba(168, 85, 247, 0.85), 0 0 34px rgba(34, 211, 238, 0.5);
        }
        .game-card:hover .thumb-ph .initials { transform: scale(1.15) rotate(-6deg); }
        .game-card:hover .thumb { transform: scale(1.08); }
        .game-card .card-body {
            padding: 14px 14px 8px;
            flex: 1;
        }
        .game-card .card-body h3 {
            font-size: 1rem;
            line-height: 1.3;
            margin-bottom: 4px;
            color: #fff;
        }
        .game-card .card-body .cats {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .game-card .play-btn {
            margin: 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--nebula-purple), var(--cosmic-pink));
            color: #fff;
            font-family: var(--main-font);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .game-card:hover .play-btn { box-shadow: 0 6px 20px rgba(168,85,247,0.5); }
        .game-card:hover .play-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .empty-state i { display: block; font-size: 3rem; margin-bottom: 14px; color: var(--cosmic-cyan); }

        .back-bar { margin-top: 30px; text-align: center; }

        /* ===== Footer ===== */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 28px;
            color: var(--text-muted);
            font-size: 0.95rem;
            border-top: 1px solid rgba(168, 85, 247, 0.12);
            background: rgba(5, 4, 15, 0.55);
        }
        footer span { color: var(--cosmic-cyan); }

        @media (max-width: 720px) {
            .header-inner { flex-direction: column; padding: 14px; }
            nav { justify-content: center; }
            .section-card { padding: 30px 22px; }
            .hero { padding: 40px 18px; }
        }
    </style>
</head>

            return type === 'apps'
                ? 'https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/games/apps.json'
                : 'https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/games/games.json';
        }

        function showGallery(type) {
            galleryType = type;
            const container = document.getElementById('content-container');
            container.style.display = 'block';
            container.innerHTML =
                '<div class="gallery-head"><h1>' + (type === 'apps' ? 'Apps' : 'Games') + '</h1>' +
                '<p>Browse all the ' + (type === 'apps' ? 'apps' : 'games') + ' — click a card to play!</p></div>' +
                '<div class="gallery-tools" id="galleryTools">' +
                '<input type="text" id="gSearch" placeholder="Search ' + (type === 'apps' ? 'apps' : 'games') + '..." oninput="onSearch()">' +
                '<span class="count-badge" id="gCount"></span>' +
                '</div>' +
                '<div class="cat-chips" id="chipBar"></div>' +
                '<div class="game-grid" id="gameGrid"><div class="empty-state"><i class="fas fa-rocket"></i> Loading...</div></div>' +
                '<div class="pagination" id="pagination"></div>' +
                '<div class="back-bar"><button class="btn btn-ghost" onclick="showHome();"><i class="fas fa-arrow-left"></i> Back to Home</button></div>';
            restartAnimation(container);
            setActive(type === 'apps' ? 'apps' : 'games');

            const frame = document.getElementById('Game');
            frame.src = 'about:blank';
            frame.style.display = 'none';
            document.getElementById('gameBar').style.display = 'none';

            currentCategory = 'All';
            loadPageContent(galleryJsonUrl(type), function(text) {
                try {
                    galleryData = JSON.parse(text);
                } catch (e) {
                    galleryData = [];
                }
                // Remove the "Request a Feature" entry (it's in both feeds).
                if (Array.isArray(galleryData)) {
                    galleryData = galleryData.filter(function(g) {
                        return !/request a feature/i.test((g.title || '').trim());
                    });
                }
                // Merge the gn-math collection into the Games tab (not Apps).
                if (type === 'games' && Array.isArray(galleryData)) {
                    // Convert arcade entries to a normalized shape and dedupe by title
                    const existing = {};
                    galleryData.forEach(function(g) {
                        existing[(g.title || '').toLowerCase().trim()] = true;
                    });
                    GN_CATALOG.forEach(function(g) {
                        const key = g.title.toLowerCase().trim();
                        if (!existing[key]) {
                            galleryData.push(g);
                            existing[key] = true;
                        }
                    });
                }
                // Add the custom BlooketBot app to the Apps tab (loaded as a direct iframe).
                if (type === 'apps' && Array.isArray(galleryData)) {
                    galleryData.unshift({
                        title: 'BlooketBot',
                        image: 'https://gitlab.com/arcade_v/arcade_v_images/-/raw/main/favicon/blooket.ico',
                        url: 'https://learningaboutbookss.b-cdn.net/',
                        category: ['Tools'],
                        direct: true
                    });
                }
                buildChips();
                renderGallery();
            });
        }

        let currentCategory = 'All';

        function normalizeCat(c) {
            return String(c).trim().toLowerCase() === 'multi player' ? 'Multiplayer' : c;
        }

        function buildChips() {
            const set = {};
            galleryData.forEach(function(g) {
                (g.category || []).forEach(function(c) { set[normalizeCat(c)] = true; });
            });
            const cats = Object.keys(set).sort();
            let html = '<button class="chip active" onclick="setCategory(\'All\')">All</button>';
            cats.forEach(function(c) {
                html += '<button class="chip" onclick="setCategory(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
            });
            document.getElementById('chipBar').innerHTML = html;
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('#chipBar .chip').forEach(function(chip) {
                chip.classList.toggle('active', chip.textContent === cat);
            });
            currentPage = 1;
            renderGallery();
        }

        function onSearch() {
            currentPage = 1;
            renderGallery();
        }

        let PER_PAGE = 12;
        let currentPage = 1;

        function renderGallery() {
            const q = (document.getElementById('gSearch').value || '').toLowerCase().trim();

            const filtered = galleryData.filter(function(g) {
                const matchesQ = !q || (g.title || '').toLowerCase().includes(q);
                const matchesCat = currentCategory === 'All' ||
                    (g.category || []).some(function(c) { return normalizeCat(c) === currentCategory; });
                return matchesQ && matchesCat;
            });

            const count = document.getElementById('gCount');
            count.textContent = filtered.length + ' found';

            const grid = document.getElementById('gameGrid');
            const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PER_PAGE;
            const pageItems = filtered.slice(start, start + PER_PAGE);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-satellite-dish"></i> Nothing found.</div>';
                renderPagination(totalPages);
                return;
            }

            let html = '';
            pageItems.forEach(function(g, i) {
                const title = (g.title || 'Untitled').toString();
                const safeTitle = title.replace(/"/g, '&quot;');
                const img = g.image || g.logo || '';
                const catCount = (g.category || []).length;
                const cats = (g.category || []).slice(0, 3).join(', ') + (catCount > 3 ? ' +' + (catCount - 3) : '');
                const initials = (title.replace(/[^a-zA-Z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(function(w){ return w[0]; }).join('')).toUpperCase() || '?';
                const thumb = img
                    ? '<img class="thumb" src="' + img + '" alt="' + safeTitle + '" loading="lazy" onerror="this.onerror=null;this.parentNode.innerHTML=\'<div class=&quot;thumb thumb-ph&quot;><span class=&quot;initials&quot;>' + initials + '</span></div>\';">'
                    : '<div class="thumb thumb-ph"><span class="initials">' + initials + '</span></div>';
                html +=
                    '<div class="game-card" style="animation-delay:' + (i % 12) * 0.02 + 's">' +
                    thumb +
                    '<div class="card-body"><h3>' + safeTitle + '</h3><div class="cats">' + cats + '</div></div>' +
                    '<button class="play-btn" data-url="' + g.url + '"' + (g.direct ? ' data-direct="1"' : '') + ' onclick="playGame(this)"><i class="fas fa-play"></i> Launch</button>' +
                    '</div>';
            });
            grid.innerHTML = html;

            renderPagination(totalPages);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(totalPages) {
            const p = document.getElementById('pagination');
            if (totalPages <= 1) {
                p.innerHTML = '';
                return;
            }
            const cp = currentPage;

            let html = '<div class="page-size">Show ' +
                '<select onchange="setPageSize(this.value)">' +
                '<option value="12"' + (PER_PAGE === 12 ? ' selected' : '') + '>12</option>' +
                '<option value="24"' + (PER_PAGE === 24 ? ' selected' : '') + '>24</option>' +
                '<option value="48"' + (PER_PAGE === 48 ? ' selected' : '') + '>48</option>' +
                '<option value="96"' + (PER_PAGE === 96 ? ' selected' : '') + '>96</option>' +
                '</select> per page</div>';

            html += '<span class="page-nav">';
            html += '<button class="page-btn" onclick="goToPage(1)" ' + (cp === 1 ? 'disabled' : '') + ' title="First"><i class="fas fa-angle-double-left"></i></button>';
            html += '<button class="page-btn" onclick="goToPage(' + (cp - 1) + ')" ' + (cp === 1 ? 'disabled' : '') + ' title="Previous"><i class="fas fa-chevron-left"></i></button>';

            // Windowed page numbers with ellipsis
            const win = 2;
            const pages = [];
            for (var i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= cp - win && i <= cp + win)) pages.push(i);
            }
            let prev = 0;
            pages.forEach(function(pi) {
                if (prev && pi - prev > 1) {
                    html += '<button class="page-btn page-ellipsis" disabled>…</button>';
                }
                html += '<button class="page-btn' + (pi === cp ? ' active' : '') + '" onclick="goToPage(' + pi + ')">' + pi + '</button>';
                prev = pi;
            });

            html += '<button class="page-btn" onclick="goToPage(' + (cp + 1) + ')" ' + (cp === totalPages ? 'disabled' : '') + ' title="Next"><i class="fas fa-chevron-right"></i></button>';
            html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')" ' + (cp === totalPages ? 'disabled' : '') + ' title="Last"><i class="fas fa-angle-double-right"></i></button>';
            html += '</span>';

            // Jump-to-page box
            html += '<span class="page-jump"><i class="fas fa-forward"></i> Jump to ' +
                '<input type="number" id="jumpInput" min="1" max="' + totalPages + '" value="' + cp + '" onkeydown="if(event.key===\'Enter\')jumpToPage(this.value);"> ' +
                '<span class="jump-total">/ ' + totalPages + '</span>' +
                '<button class="page-btn page-go" onclick="jumpToPage(document.getElementById(\'jumpInput\').value)">Go</button></span>';

            p.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.max(1, Math.ceil(currentFilteredLength() / PER_PAGE));
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;
            renderGallery();
        }

        function jumpToPage(val) {
            const page = parseInt(val, 10);
            const totalPages = Math.max(1, Math.ceil(currentFilteredLength() / PER_PAGE));
            goToPage(isNaN(page) ? 1 : page);
        }

        function setPageSize(val) {
            PER_PAGE = parseInt(val, 10) || 12;
            currentPage = 1;
            renderGallery();
        }

        function currentFilteredLength() {
            const q = (document.getElementById('gSearch').value || '').toLowerCase().trim();
            return galleryData.filter(function(g) {
                const matchesQ = !q || (g.title || '').toLowerCase().includes(q);
                const matchesCat = currentCategory === 'All' ||
                    (g.category || []).some(function(c) { return normalizeCat(c) === currentCategory; });
                return matchesQ && matchesCat;
            }).length;
        }

        function playGame(btn) {
            const url = btn.getAttribute('data-url');
            if (!url) return;
            if (btn.getAttribute('data-direct')) {
                setIframe(url);
            } else {
                launchGame(url);
            }
        }

        // Launch a game. Most game URLs block direct iframe embedding,
        // so we fetch the HTML and load it via a blob URL.
        function launchGame(url) {
            loadPageContent(url, function(content) {
                var blob = new Blob([content], {type: 'text/html'});
                var iframe = document.getElementById('Game');
                iframe.src = URL.createObjectURL(blob);
                document.getElementById('content-container').style.display = 'none';
                iframe.style.display = 'block';
                document.getElementById('gameBar').style.display = 'flex';
                window.scrollTo(0, 0);
            });
        }

        // ===== Background theme picker =====
        const BG_THEMES = [
            { key: 'deep',    name: 'Purple' },
            { key: 'aurora',  name: 'Teal' },
            { key: 'flare',   name: 'Red' },
            { key: 'candy',   name: 'Pink' },
            { key: 'vortex',  name: 'Blue' },
            { key: 'emerald', name: 'Green' }
        ];

        function applyTheme(key) {
            if (!key) key = 'deep';
            document.body.classList.remove('theme-deep', 'theme-aurora', 'theme-flare', 'theme-candy', 'theme-vortex', 'theme-emerald');
            document.body.classList.add('theme-' + key);
            localStorage.setItem('bgTheme', key);
            // highlight the active button if the picker is visible
            var opts = document.querySelectorAll('#bgPicker .bg-option');
            for (var i = 0; i < opts.length; i++) {
                opts[i].classList.toggle('active', opts[i].getAttribute('data-theme') === key);
            }
        }

        // Load the remote settings page
        function loadSettings() {
            loadPageContent('https://cdn.jsdelivr.net/npm/@arcade-v/arcade_v/navigation/settings.html', function(content) {
                // Extract only the <body> contents of the settings page
                let bodyContent = content;
                const bodyMatch = content.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                if (bodyMatch) bodyContent = bodyMatch[1];

                const template = document.createElement('template');
                template.innerHTML = bodyContent;
                const doc = template.content;
                // Remove the font dropdown
                const font = doc.getElementById('fontDropdown');
                if (font) font.remove();
                // Remove "Change Normal Text Color"
                const c1 = doc.getElementById('textColorPicker1');
                if (c1 && c1.parentElement) c1.parentElement.remove();
                // Remove "Change Selected Text Color"
                const c2 = doc.getElementById('textColorPicker2');
                if (c2 && c2.parentElement) c2.parentElement.remove();
                // Remove the existing Background dropdown (we have our own picker)
                const bgDrop = doc.getElementById('backgroundDropdown');
                if (bgDrop) bgDrop.remove();
                // Center the tab cloaking dropdown and give it a heading
                const cloak = doc.getElementById('cloakDropdown');
                if (cloak) {
                    const cloakWrap = document.createElement('div');
                    cloakWrap.style.cssText =
                        'text-align:center; margin:34px auto 10px; width:100%; display:block;';
                    const cloakHeading = document.createElement('h2');
                    cloakHeading.textContent = 'Tab Cloaking';
                    cloakHeading.style.cssText =
                        'font-family:var(--main-font); font-size:1.4rem; margin-bottom:16px; color:#fff;';
                    cloak.style.cssText =
                        'padding:12px 18px; border-radius:12px; border:1px solid rgba(168,85,247,0.3);' +
                        'background:rgba(168,85,247,0.1); color:#fff;' +
                        'font-family:var(--main-font); font-size:1rem; cursor:pointer;';
                    const parent = cloak.parentNode;
                    parent.insertBefore(cloakWrap, cloak);
                    cloakWrap.appendChild(cloakHeading);
                    cloakWrap.appendChild(cloak);
                }

                // Build and prepend the Background theme picker
                const bgSection = document.createElement('div');
                bgSection.className = 'section-card';
                let bgHtml = '<h2><i class="fas fa-palette" style="color:#22d3ee;"></i> Background</h2>' +
                    '<p>Pick a backdrop for your galaxy.</p>' +
                    '<div class="bg-options" id="bgPicker">';
                const current = localStorage.getItem('bgTheme') || 'deep';
                BG_THEMES.forEach(function(t) {
                    const active = t.key === current ? ' active' : '';
                    bgHtml += '<div class="bg-option' + active + '" data-theme="' + t.key + '" onclick="applyTheme(\'' + t.key + '\')">' +
                        '<div class="bg-swatch sw-' + t.key + '"></div>' +
                        '<div class="bg-name">' + t.name + '</div></div>';
                });
                bgHtml += '</div>';
                bgSection.innerHTML = bgHtml;
                doc.insertBefore(bgSection, doc.firstChild);

                const container = document.getElementById('content-container');
                container.style.display = 'block';
                container.innerHTML = '';
                container.appendChild(doc);
                restartAnimation(container);
                const frame = document.getElementById('Game');
                frame.src = 'about:blank';
                frame.style.display = 'none';
                document.getElementById('gameBar').style.display = 'none';
            });
            setActive('settings');
        }

        function restartAnimation(el) {
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = '';
        }

        // Set active nav link
        function setActive(page) {
            document.querySelectorAll('nav a[data-page]').forEach(function(link) {
                link.classList.toggle('active', link.getAttribute('data-page') === page);
            });
        }

        // Load an actual game URL into the iframe
        function setIframe(page) {
            const frame = document.getElementById('Game');
            const container = document.getElementById('content-container');
            container.style.display = 'none';
            frame.src = page;
            frame.style.display = 'block';
            document.getElementById('gameBar').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        // Load blob content into the iframe
        function loadBlobContent(url) {
            loadPageContent(url, function(content) {
                var blob = new Blob([content], {type: 'text/html'});
                var iframe = document.getElementById('Game');
                iframe.src = URL.createObjectURL(blob);
                document.getElementById('content-container').style.display = 'none';
                iframe.style.display = 'block';
            });
        }

        // Fetch page content with a loading spinner
        function loadPageContent(url, callback) {
            const xhttp = new XMLHttpRequest();
            document.getElementById('spinner').style.display = 'flex';
            const urlWithNoCache = url + (url.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime();
            xhttp.onreadystatechange = function() {
                if (this.readyState === 4) {
                    document.getElementById('spinner').style.display = 'none';
                    if (this.status === 200) {
                        callback(this.responseText);
                    } else {
                        console.error('Failed to load:', url);
                    }
                }
            };
            xhttp.open('GET', urlWithNoCache, true);
            xhttp.send();
        }

        // Trigger fullscreen on the whole document so the background, stars,
        // and navbar all stay visible and navigation keeps working while fullscreen.
        function triggerFullscreen() {
            const docEl = document.documentElement;
            const req = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) req.call(docEl);
        }

        // Fullscreen just the game/app iframe that's currently open.
        function triggerGameFullscreen() {
            const iframe = document.getElementById('Game');
            if (!iframe) return;
            const req = iframe.requestFullscreen || iframe.mozRequestFullScreen || iframe.webkitRequestFullscreen || iframe.msRequestFullscreen;
            if (req) req.call(iframe);
        }

        function appendScript(url, callback) {
            const script = document.createElement('script');
            script.src = url;
            script.type = 'text/javascript';
            script.onload = function() { if (callback) callback(); };
            script.onerror = function() {};
            document.body.appendChild(script);
        }

        // Keep the legacy customization scripts happy
        if (localStorage.getItem('faviconSrc') == null) {
            localStorage.setItem('faviconSrc', 'https://gitlab.com/arcade_v/arcade_v_images/-/raw/main/favicon/logo.png');
        }
        if (localStorage.getItem('pageTitle') == null) {
            localStorage.setItem('pageTitle', 'Galactic Games');
        }

        // Apply any saved background theme on load
        applyTheme(localStorage.getItem('bgTheme') || 'deep');

        // Start on the built-in homepage
        showHome();
    </script>
</body>
</html>
